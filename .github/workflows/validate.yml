# SPDX-License-Identifier: MIT
name: Validate image

on: [workflow_call]

permissions:
  contents: read

jobs:
  validate:
    name: Validate linux/${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      IMAGE_NAME: ghcr.io/mobtitude/bats:${{ github.sha }}-${{ matrix.arch }}
    steps:
    - name: Setup Task
      uses: arduino/setup-task@v3
      with:
        version: 3.x
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build
      id: build
      run: |
        task docker:build IMAGE_NAME="$IMAGE_NAME" PLATFORM='linux/${{ matrix.arch }}' NO_CACHE=true
    - name: Test
      run: |
        task docker:test IMAGE_NAME="$IMAGE_NAME" PLATFORM='linux/${{ matrix.arch }}'
    - name: Vulnerability scan
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_PLATFORM: linux/${{ matrix.arch }}
      with:
        version: 'v0.76.1'
        image-ref: ${{ env.IMAGE_NAME }}
        trivy-config: '.github/linters/.trivy.yml'
    - name: Container best practices
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        task dockle:lint IMAGE_NAME="$IMAGE_NAME" \
          DOCKLE_COMMAND='docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro goodwithtech/dockle:v0.4.15'
